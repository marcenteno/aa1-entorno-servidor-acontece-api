
# ==========================================
# CONFIGURACION DE ACONTECE
# ==========================================

spring.application.name=acontece-api


# ==========================================
# CONEXION A MARIADB
# ==========================================

spring.datasource.url=jdbc:mariadb://localhost:3306/eventos_db
spring.datasource.username=root
spring.datasource.password=CONTRASEÑA
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ==========================================
# CONFIGURACION JPA / HIBERNATE
# ==========================================

# Actualiza las tablas segun las entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en consola
spring.jpa.show-sql=true

# Formatea las consultas SQL
spring.jpa.properties.hibernate.format_sql=true
